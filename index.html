<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain World Editor (MVP)</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 0; }
      header { padding: 12px 16px; background: #111827; color: white; }
      main { padding: 16px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
      button { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #f8fafc; cursor: pointer; }
      button.primary { background: #2563eb; color: white; border-color: #1d4ed8; }
      .textarea { width: 100%; min-height: 280px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; font-size: 12px; }
      .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; }
      .issues { margin-top: 8px; }
      .issue { padding: 6px 8px; border-left: 4px solid; margin: 4px 0; background: #f9fafb; }
      .error { border-color: #dc2626; }
      .warning { border-color: #d97706; }
      .info { border-color: #2563eb; }
      .muted { color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
